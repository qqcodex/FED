<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Activity Finder</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main>
            <h1>Activity Finder</h1>
            <p>Lesson 2: functions and structured data</p>
            <p>Find the perfect activity for you!</p>
            <p>Search for activities:</p>
            <input type="text" id="search-input" placeholder="Search...">
            <article class="activity-card">
                <h2>Chess Club</h2>
                <p>Games · Studio 2</p>
                <p class="status status-available">Available</p>
            </article>
        </main>
        <script src="app.js"></script>
    </body>
</html>
